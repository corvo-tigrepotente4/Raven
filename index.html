<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Raven — Brookhaven AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --panel-hover: #1b222c;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --blue: #58a6ff;
            --green: #238636;
            --green-hover: #2ea043;
            --danger: #f85149;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(88, 166, 255, 0.08),
                    transparent 45%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* HEADER */

        header {
            height: 64px;
            min-height: 64px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-bottom: 1px solid var(--border);

            background: rgba(22, 27, 34, 0.92);

            backdrop-filter: blur(12px);

            position: relative;
            z-index: 5;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #21262d,
                    #161b22
                );

            border: 1px solid var(--border);

            font-size: 17px;

            box-shadow:
                0 0 18px rgba(88, 166, 255, 0.08);

            animation: logoFloat 4s ease-in-out infinite;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-left: 2px;
        }

        .status {
            margin-left: 14px;

            font-size: 12px;
            color: #3fb950;

            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #3fb950;

            box-shadow:
                0 0 8px rgba(63, 185, 80, 0.7);

            animation: pulse 2s infinite;
        }

        .header-actions {
            margin-left: auto;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-button {
            border: 1px solid var(--border);

            background: rgba(13, 17, 23, 0.7);

            color: var(--muted);

            padding: 8px 11px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 12px;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .header-button:hover {
            background: var(--panel-hover);
            color: var(--text);
            border-color: #484f58;
            transform: translateY(-1px);
        }

        /* CHAT */

        #chat {
            flex: 1;

            overflow-y: auto;

            padding: 34px 20px 30px;

            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 8px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        .message {
            max-width: 850px;

            margin: 0 auto 25px;

            animation: messageIn 0.3s ease both;
        }

        .label {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 11px;
            font-weight: 700;

            margin-bottom: 8px;

            color: var(--muted);

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }

        .label-raven::before {
            content: "🐦";
            font-size: 12px;
        }

        .label-user::before {
            content: "●";

            font-size: 8px;
            color: var(--blue);
        }

        .bubble {
            background:
                linear-gradient(
                    180deg,
                    rgba(22, 27, 34, 0.96),
                    rgba(22, 27, 34, 0.88)
                );

            border: 1px solid var(--border);

            border-radius: 13px;

            padding: 16px 18px;

            line-height: 1.65;

            white-space: pre-wrap;

            word-wrap: break-word;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .bubble:hover {
            border-color: #3b434d;
        }

        .user .bubble {
            background:
                linear-gradient(
                    180deg,
                    #21262d,
                    #1c2128
                );
        }

        /* THINKING */

        .thinking-bubble {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            min-width: 62px;

            padding: 13px 15px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--muted);

            animation:
                thinking 1.2s infinite ease-in-out;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        /* WELCOME */

        .welcome {
            max-width: 850px;

            margin: 8vh auto 35px;

            text-align: center;

            animation: welcomeIn 0.6s ease both;
        }

        .welcome-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #21262d,
                    #161b22
                );

            border: 1px solid var(--border);

            font-size: 29px;

            box-shadow:
                0 0 35px rgba(88, 166, 255, 0.08);

            animation:
                logoFloat 4s ease-in-out infinite;
        }

        .welcome h1 {
            margin: 0 0 8px;

            font-size: 25px;

            letter-spacing: -0.6px;
        }

        .welcome p {
            margin: 0;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;
        }

        /* FOOTER */

        footer {
            border-top: 1px solid var(--border);

            background:
                rgba(22, 27, 34, 0.94);

            backdrop-filter: blur(12px);

            padding: 15px 16px;

            position: relative;
            z-index: 5;
        }

        .input-area {
            max-width: 850px;

            margin: auto;

            display: flex;

            align-items: flex-end;

            gap: 10px;
        }

        #question {
            flex: 1;

            resize: none;

            min-height: 48px;
            max-height: 150px;

            padding: 14px 15px;

            border-radius: 11px;

            border: 1px solid var(--border);

            background: #0d1117;

            color: var(--text);

            font-family: inherit;

            font-size: 15px;

            line-height: 1.4;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #question::placeholder {
            color: #6e7681;
        }

        #question:focus {
            border-color: var(--blue);

            box-shadow:
                0 0 0 3px rgba(88, 166, 255, 0.08);
        }

        #send {
            height: 48px;

            border: 1px solid rgba(255, 255, 255, 0.04);

            border-radius: 10px;

            padding: 0 19px;

            background:
                linear-gradient(
                    180deg,
                    #2ea043,
                    #238636
                );

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                filter 0.15s ease,
                opacity 0.2s ease;
        }

        #send:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        #send:active:not(:disabled) {
            transform: translateY(1px);
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hint {
            max-width: 850px;

            margin: 8px auto 0;

            font-size: 11px;

            color: #6e7681;

            text-align: center;
        }

        /* ERROR */

        .error .bubble {
            border-color: rgba(248, 81, 73, 0.35);
        }

        /* ANIMATIONS */

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes welcomeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.8);
            }
        }

        @keyframes thinking {
            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                height: 58px;
                min-height: 58px;
                padding: 0 14px;
            }

            .brand-subtitle {
                display: none;
            }

            .status {
                margin-left: 9px;
            }

            #chat {
                padding:
                    22px 12px 25px;
            }

            .message {
                margin-bottom: 20px;
            }

            .bubble {
                padding: 14px 15px;
                font-size: 14px;
            }

            .welcome {
                margin-top: 7vh;
            }

            .welcome h1 {
                font-size: 22px;
            }

            footer {
                padding: 10px;
            }

            .input-area {
                gap: 7px;
            }

            #question {
                font-size: 14px;
            }

            #send {
                padding: 0 15px;
            }

            .header-button {
                padding: 7px 8px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">

        <div class="logo">
            🐦‍⬛
        </div>

        <div>
            <div class="brand-name">
                Raven
            </div>

            <div class="brand-subtitle">
                Brookhaven AI
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">Online</span>
        </div>

    </div>

    <div class="header-actions">

        <button
            class="header-button"
            id="newChat"
            type="button"
        >
            New chat
        </button>

    </div>

</header>


<main id="chat">

    <div class="welcome" id="welcome">

        <div class="welcome-icon">
            🐦‍⬛
        </div>

        <h1>
            Ask Raven
        </h1>

        <p>
            Explore Brookhaven secrets, mysteries, puzzles,
            Agency lore, quests, codes, and theories.
        </p>

    </div>

</main>


<footer>

    <div class="input-area">

        <textarea
            id="question"
            placeholder="Ask Raven about a Brookhaven secret..."
            rows="1"
            autocomplete="off"
        ></textarea>

        <button
            id="send"
            type="button"
        >
            Send
        </button>

    </div>

    <div class="hint">
        Enter to send · Shift + Enter for a new line
    </div>

</footer>


<script>

    /*
        ============================================================
        RAVEN API
        ============================================================

        The frontend is NOT necessarily hosted by the FastAPI
        Render service, so do NOT use "/ask".

        This points directly to the NEW Raven backend.
    */

    const API_URL =
        "https://raven-ksqm.onrender.com/ask";


    const chat =
        document.getElementById("chat");

    const question =
        document.getElementById("question");

    const send =
        document.getElementById("send");

    const newChat =
        document.getElementById("newChat");

    const welcome =
        document.getElementById("welcome");

    const statusText =
        document.getElementById("statusText");


    /*
        ============================================================
        CONVERSATION MEMORY
        ============================================================

        This memory belongs only to this browser conversation.

        Each request sends the previous messages to the backend.
    */

    let conversation = [];


    /*
        ============================================================
        ADD MESSAGE
        ============================================================
    */

    function addMessage(role, text) {

        if (welcome) {
            welcome.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            "message " +
            (role === "user"
                ? "user"
                : "raven");


        const label =
            document.createElement("div");

        label.className =
            "label " +
            (role === "user"
                ? "label-user"
                : "label-raven");


        label.textContent =
            role === "user"
                ? "You"
                : "Raven";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.textContent =
            text;


        message.appendChild(label);

        message.appendChild(bubble);

        chat.appendChild(message);


        chat.scrollTop =
            chat.scrollHeight;


        return message;
    }


    /*
        ============================================================
        THINKING INDICATOR
        ============================================================
    */

    function addThinking() {

        const message =
            document.createElement("div");

        message.className =
            "message raven";


        const label =
            document.createElement("div");

        label.className =
            "label label-raven";

        label.textContent =
            "Raven";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble thinking-bubble";


        for (let i = 0; i < 3; i++) {

            const dot =
                document.createElement("span");

            dot.className =
                "thinking-dot";

            bubble.appendChild(dot);
        }


        message.appendChild(label);

        message.appendChild(bubble);

        chat.appendChild(message);


        chat.scrollTop =
            chat.scrollHeight;


        return message;
    }


    /*
        ============================================================
        LOADING STATE
        ============================================================
    */

    function setLoading(value) {

        send.disabled =
            value;

        question.disabled =
            value;


        send.textContent =
            value
                ? "Thinking..."
                : "Send";
    }


    /*
        ============================================================
        ASK RAVEN
        ============================================================
    */

    async function askRaven() {

        const text =
            question.value.trim();


        if (
            !text ||
            send.disabled
        ) {
            return;
        }


        /*
            Show user's message immediately.
        */

        addMessage(
            "user",
            text
        );


        /*
            Add user message to local memory.
        */

        conversation.push({

            role:
                "user",

            content:
                text
        });


        question.value = "";

        question.style.height =
            "48px";


        setLoading(true);


        const thinking =
            addThinking();


        try {

            /*
                ====================================================
                IMPORTANT

                main.py expects:

                {
                    "question": "...",
                    "history": [...]
                }

                NOT:

                {
                    "message": "...",
                    "conversation": [...]
                }
                ====================================================
            */

            const history =
                conversation
                    .slice(0, -1)
                    .slice(-6);


            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers:
                            {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                        body:
                            JSON.stringify({

                                question:
                                    text,

                                history:
                                    history
                            })
                    }
                );


            /*
                Always read the response body.

                This makes backend errors visible.
            */

            const raw =
                await response.text();


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status +
                    ": " +
                    raw
                );
            }


            let data;


            try {

                data =
                    JSON.parse(raw);

            } catch {

                throw new Error(
                    "Backend returned invalid JSON:\n" +
                    raw
                );
            }


            thinking.remove();


            /*
                main.py returns:

                {
                    "answer": "..."
                }
            */

            const answer =
                data.answer;


            if (
                typeof answer !== "string" ||
                !answer.trim()
            ) {

                throw new Error(
                    "Backend returned no usable answer."
                );
            }


            /*
                Show Raven's answer.
            */

            addMessage(
                "assistant",
                answer
            );


            /*
                Store Raven's answer in conversation memory.
            */

            conversation.push({

                role:
                    "assistant",

                content:
                    answer
            });


        } catch (error) {

            thinking.remove();


            console.error(
                "Raven request failed:",
                error
            );


            const errorText =
                "Raven could not contact the backend.\n\n" +
                error.message;


            const errorMessage =
                addMessage(
                    "assistant",
                    errorText
                );


            errorMessage.classList.add(
                "error"
            );


        } finally {

            setLoading(false);

            question.focus();
        }
    }


    /*
        ============================================================
        SEND BUTTON
        ============================================================
    */

    send.addEventListener(
        "click",
        askRaven
    );


    /*
        ============================================================
        ENTER TO SEND
        ============================================================
    */

    question.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                askRaven();
            }
        }
    );


    /*
        ============================================================
        AUTO-RESIZE TEXTAREA
        ============================================================
    */

    question.addEventListener(
        "input",
        function() {

            this.style.height =
                "48px";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";
        }
    );


    /*
        ============================================================
        NEW CHAT
        ============================================================
    */

    newChat.addEventListener(
        "click",
        function() {

            conversation = [];


            chat.innerHTML = "";


            const welcomeElement =
                document.createElement("div");


            welcomeElement.className =
                "welcome";


            welcomeElement.id =
                "welcome";


            welcomeElement.innerHTML = `
                <div class="welcome-icon">🐦‍⬛</div>

                <h1>Ask Raven</h1>

                <p>
                    Explore Brookhaven secrets, mysteries,
                    puzzles, Agency lore, quests, codes,
                    and theories.
                </p>
            `;


            chat.appendChild(
                welcomeElement
            );


            question.value =
                "";


            question.style.height =
                "48px";


            question.focus();
        }
    );


    /*
        ============================================================
        BACKEND STATUS CHECK
        ============================================================

        This checks the NEW Render backend directly.
    */

    async function checkBackend() {

        try {

            const response =
                await fetch(
                    "https://raven-ksqm.onrender.com/"
                );


            if (response.ok) {

                statusText.textContent =
                    "Online";

            } else {

                statusText.textContent =
                    "Backend error";
            }


        } catch (error) {

            console.error(
                "Backend status check failed:",
                error
            );


            statusText.textContent =
                "Offline";
        }
    }


    /*
        Start backend check.
    */

    checkBackend();


    /*
        Focus input.
    */

    question.focus();

</script>

</body>
</html>
