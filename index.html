<title>Brookhaven AI</title>

<style>

</head>

<body>

<header>
    <div class="logo">🐦 Raven - Brookhaven Secrets Assistant</div>
    <div class="status" id="status">Online</div>
</header>

<main id="chat">

```
<div class="message">
    <div class="label">Brookhaven AI</div>

    <div class="bubble">
        Ask me about Brookhaven secrets, mysteries, puzzles, the Agency, quests, codes, and lore.
    </div>
</div>
```

</main>

<footer>

```
<div class="input-area">

    <textarea
        id="question"
        placeholder="Ask about a Brookhaven secret..."
        rows="1"
    ></textarea>

    <button id="send">Send</button>

</div>
```

</footer>

<script>

    // ============================================================
    // CONFIG
    // ============================================================

    const API_URL = "https://raven-ksqm.onrender.com/ask";


    // ============================================================
    // ELEMENTS
    // ============================================================

    const chat = document.getElementById("chat");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");


    // ============================================================
    // ADD MESSAGE
    // ============================================================

    function addMessage(label, text, type = "") {

        const message = document.createElement("div");
        message.className = `message ${type}`;

        const labelElement = document.createElement("div");
        labelElement.className = "label";
        labelElement.textContent = label;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        message.appendChild(labelElement);
        message.appendChild(bubble);

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

        return message;
    }


    // ============================================================
    // ASK AI
    // ============================================================

    async function askAI() {

        const question = questionInput.value.trim();

        if (!question || sendButton.disabled) {
            return;
        }

        addMessage("You", question, "user");

        questionInput.value = "";
        sendButton.disabled = true;

        const thinkingMessage = addMessage(
            "Brookhaven AI",
            "Thinking...",
            "ai"
        );

        thinkingMessage.querySelector(".bubble").classList.add("thinking");

        status.textContent = "Thinking";

        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }


            const data = await response.json();


            thinkingMessage.querySelector(".bubble").textContent =
                data.answer || "I couldn't generate an answer.";


            thinkingMessage.querySelector(".bubble")
                .classList.remove("thinking");

            status.textContent = "Online";

        }

        catch (error) {

            console.error(error);

            thinkingMessage.querySelector(".bubble").textContent =
                "I couldn't connect to Brookhaven AI right now.";

            thinkingMessage.querySelector(".bubble")
                .classList.remove("thinking");

            status.textContent = "Connection error";

        }

        finally {

            sendButton.disabled = false;
            questionInput.focus();

        }
    }


    // ============================================================
    // SEND BUTTON
    // ============================================================

    sendButton.addEventListener("click", askAI);


    // ============================================================
    // ENTER TO SEND
    // ============================================================

    questionInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            askAI();

        }

    });


    // ============================================================
    // AUTO RESIZE TEXTAREA
    // ============================================================

    questionInput.addEventListener("input", function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight, 150) + "px";

    });

</script>

</body>
</html>
